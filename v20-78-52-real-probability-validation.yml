name: V20.78.52 Probability Structure Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "REPOSITORY ROOT"
          echo "======================================"

          pwd

          echo ""
          echo "ROOT FILES:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "SEARCH PROBABILITY FILES:"
          find . -type f \
            \( -iname "*probability*" \
            -o -iname "*market*" \
            -o -iname "*calibration*" \
            -o -iname "*qualification*" \
            -o -iname "*parlay*" \) \
            | sort

      - name: Check expected probability files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking expected files..."

          files=(
            "v20_78_51_probability_core.py"
            "v20_78_probability_engine.py"
            "v20_78_51_market_registry.py"
            "v20_78_51_market_value.py"
            "v20_78_51_calibration.py"
            "v20_78_51_match_qualification.py"
            "v20_78_51_parlay.py"
          )

          for file in "${files[@]}"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi

          done

      - name: Check Python import paths
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys

          print("Python:", sys.version)
          print("Working directory:", os.getcwd())

          print("")
          print("sys.path:")

          for path in sys.path:
              print(path)

          print("")
          print("Python files in root:")

          for name in sorted(os.listdir(".")):
              if name.endswith(".py"):
                  print(name)
          PY

      - name: Finish diagnostic
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "STRUCTURE DIAGNOSTIC COMPLETE"
          echo "======================================"
