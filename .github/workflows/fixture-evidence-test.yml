name: Fixture Resolver Evidence Test

on:
  workflow_dispatch:

jobs:
  resolve-evidence:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Resolve Fixture
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          BASE_URL = "https://v3.football.api-sports.io"
          KEY = os.environ.get("API_FOOTBALL_KEY")

          if not KEY:
              print("ERROR: API_FOOTBALL_KEY tidak ditemukan")
              sys.exit(1)

          HEADERS = {
              "x-apisports-key": KEY
          }

          # TEST FIXTURE
          home = "Seattle Sounders"
          away = "Real Salt Lake"

          date_from = "2026-09-23"
          date_to = "2026-09-24"

          print("========================================")
          print("PREDIKSI 2 - FIXTURE RESOLVER TEST")
          print("========================================")
          print("HOME:", home)
          print("AWAY:", away)
          print("DATE FROM:", date_from)
          print("DATE TO:", date_to)
          print("========================================")

          # ------------------------------------------------------------
          # 1. CARI HOME TEAM
          # ------------------------------------------------------------

          r1 = requests.get(
              f"{BASE_URL}/teams",
              headers=HEADERS,
              params={"search": home},
              timeout=30
          )

          print("HOME TEAM HTTP:", r1.status_code)

          if r1.status_code != 200:
              print(r1.text)
              sys.exit(1)

          home_data = r1.json()
          home_candidates = home_data.get("response", [])

          if not home_candidates:
              print("HOME TEAM NOT FOUND")
              print(home_data.get("errors"))
              sys.exit(1)

          home_team = home_candidates[0]["team"]
          home_id = home_team["id"]

          print("HOME:", home_team["name"])
          print("HOME ID:", home_id)

          # ------------------------------------------------------------
          # 2. CARI AWAY TEAM
          # ------------------------------------------------------------

          r2 = requests.get(
              f"{BASE_URL}/teams",
              headers=HEADERS,
              params={"search": away},
              timeout=30
          )

          print("AWAY TEAM HTTP:", r2.status_code)

          if r2.status_code != 200:
              print(r2.text)
              sys.exit(1)

          away_data = r2.json()
          away_candidates = away_data.get("response", [])

          if not away_candidates:
              print("AWAY TEAM NOT FOUND")
              print(away_data.get("errors"))
              sys.exit(1)

          away_team = away_candidates[0]["team"]
          away_id = away_team["id"]

          print("AWAY:", away_team["name"])
          print("AWAY ID:", away_id)

          # ------------------------------------------------------------
          # 3. CARI SEMUA FIXTURE BERDASARKAN RENTANG TANGGAL
          # ------------------------------------------------------------

          print("----------------------------------------")
          print("SEARCH FIXTURES")

          r3 = requests.get(
              f"{BASE_URL}/fixtures",
              headers=HEADERS,
              params={
                  "from": date_from,
                  "to": date_to
              },
              timeout=30
          )

          print("FIXTURE HTTP:", r3.status_code)

          if r3.status_code != 200:
              print(r3.text)
              sys.exit(1)

          fixture_data = r3.json()

          print("API ERRORS:", fixture_data.get("errors"))

          fixtures = fixture_data.get("response", [])

          print("TOTAL FIXTURES:", len(fixtures))

          # ------------------------------------------------------------
          # 4. COCOKKAN TEAM ID
          # ------------------------------------------------------------

          matched = None

          for item in fixtures:
              teams = item.get("teams", {})

              fixture_home = teams.get("home", {}).get("id")
              fixture_away = teams.get("away", {}).get("id")

              if (
                  fixture_home == home_id
                  and fixture_away == away_id
              ):
                  matched = item
                  break

          # ------------------------------------------------------------
          # 5. JIKA TIDAK DITEMUKAN
          # ------------------------------------------------------------

          if matched is None:

              print("----------------------------------------")
              print("EXACT FIXTURE NOT FOUND")
              print("HOME ID:", home_id)
              print("AWAY ID:", away_id)
              print("CANDIDATES:", len(fixtures))

              print("----------------------------------------")
              print("SAMPLE FIXTURES:")

              for item in fixtures[:10]:

                  teams = item.get("teams", {})
                  league = item.get("league", {})
                  fixture = item.get("fixture", {})

                  h = teams.get("home", {})
                  a = teams.get("away", {})

                  print(
                      h.get("id"),
                      "-",
                      a.get("id"),
                      "|",
                      h.get("name"),
                      "vs",
                      a.get("name"),
                      "|",
                      league.get("name"),
                      "|",
                      fixture.get("date")
                  )

              print("----------------------------------------")
              print("FIXTURE RESOLUTION: FAILED")

              sys.exit(1)

          # ------------------------------------------------------------
          # 6. FIXTURE BERHASIL
          # ------------------------------------------------------------

          fixture = matched.get("fixture", {})
          league = matched.get("league", {})
          teams = matched.get("teams", {})

          fixture_id = fixture.get("id")

          print("----------------------------------------")
          print("FIXTURE RESOLUTION: PASS")
          print("----------------------------------------")

          print("FIXTURE ID:", fixture_id)

          print(
              "MATCH:",
              teams.get("home", {}).get("name"),
              "vs",
              teams.get("away", {}).get("name")
          )

          print("LEAGUE:", league.get("name"))
          print("COUNTRY:", league.get("country"))
          print("DATE:", fixture.get("date"))

          status = fixture.get("status", {})
          print("STATUS:", status.get("short"))

          # ------------------------------------------------------------
          # 7. STATISTICS
          # ------------------------------------------------------------

          stats = requests.get(
              f"{BASE_URL}/fixtures/statistics",
              headers=HEADERS,
              params={"fixture": fixture_id},
              timeout=30
          )

          print("STATISTICS HTTP:", stats.status_code)

          if stats.status_code == 200:
              stats_data = stats.json()
              print(
                  "STATISTICS ROWS:",
                  len(stats_data.get("response", []))
              )
          else:
              print("STATISTICS ERROR:", stats.text)

          # ------------------------------------------------------------
          # 8. LINEUPS
          # ------------------------------------------------------------

          lineups = requests.get(
              f"{BASE_URL}/fixtures/lineups",
              headers=HEADERS,
              params={"fixture": fixture_id},
              timeout=30
          )

          print("LINEUPS HTTP:", lineups.status_code)

          if lineups.status_code == 200:
              lineup_data = lineups.json()
              print(
                  "LINEUPS ROWS:",
                  len(lineup_data.get("response", []))
              )
          else:
              print("LINEUPS ERROR:", lineups.text)

          # ------------------------------------------------------------
          # 9. H2H
          # ------------------------------------------------------------

          h2h = requests.get(
              f"{BASE_URL}/fixtures/headtohead",
              headers=HEADERS,
              params={
                  "h2h": f"{home_id}-{away_id}"
              },
              timeout=30
          )

          print("H2H HTTP:", h2h.status_code)

          if h2h.status_code == 200:
              h2h_data = h2h.json()
              print(
                  "H2H ROWS:",
                  len(h2h_data.get("response", []))
              )
          else:
              print("H2H ERROR:", h2h.text)

          # ------------------------------------------------------------
          # 10. FINAL
          # ------------------------------------------------------------

          print("========================================")
          print("FIXTURE RESOLUTION: PASS")
          print("EVIDENCE COLLECTION: PASS")
          print("HOME ID:", home_id)
          print("AWAY ID:", away_id)
          print("FIXTURE ID:", fixture_id)
          print("========================================")
          print("TEST SELESAI")
          print("========================================")

          PY
