name: Fixture Resolver Evidence Test

on:
  workflow_dispatch:

jobs:
  resolve-evidence:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Resolve Fixture and Collect Evidence
        run: |
          python - <<'PY'
          import os
          import requests
          import sys

          BASE_URL = "https://v3.football.api-sports.io"
          KEY = os.environ.get("API_FOOTBALL_KEY")

          if not KEY:
              print("ERROR: API_FOOTBALL_KEY tidak ditemukan")
              sys.exit(1)

          HEADERS = {
              "x-apisports-key": KEY
          }

          # ============================================================
          # TEST FIXTURE
          # ============================================================

          home = "Seattle Sounders"
          away = "Real Salt Lake"

          # Rentang tanggal.
          # Dibuat 23-24 September karena pertandingan dapat tampil
          # pada tanggal berbeda tergantung timezone/API.
          date_from = "2026-09-23"
          date_to = "2026-09-24"

          print("========================================")
          print("PREDIKSI 2 - FIXTURE RESOLVER TEST")
          print("========================================")
          print("HOME:", home)
          print("AWAY:", away)
          print("DATE FROM:", date_from)
          print("DATE TO:", date_to)
          print("========================================")

          # ============================================================
          # 1. CARI TEAM HOME
          # ============================================================

          r1 = requests.get(
              f"{BASE_URL}/teams",
              headers=HEADERS,
              params={
                  "search": home
              },
              timeout=30
          )

          print("HOME TEAM HTTP:", r1.status_code)

          if r1.status_code != 200:
              print("HOME TEAM API ERROR:")
              print(r1.text)
              sys.exit(1)

          data_home = r1.json()

          if data_home.get("errors"):
              print("HOME TEAM ERRORS:", data_home["errors"])

          home_candidates = data_home.get("response", [])

          if not home_candidates:
              print("HOME TEAM NOT FOUND")
              sys.exit(1)

          home_team = home_candidates[0]["team"]
          home_id = home_team["id"]

          print("HOME RESOLVED:", home_team["name"])
          print("HOME ID:", home_id)

          # ============================================================
          # 2. CARI TEAM AWAY
          # ============================================================

          r2 = requests.get(
              f"{BASE_URL}/teams",
              headers=HEADERS,
              params={
                  "search": away
              },
              timeout=30
          )

          print("AWAY TEAM HTTP:", r2.status_code)

          if r2.status_code != 200:
              print("AWAY TEAM API ERROR:")
              print(r2.text)
              sys.exit(1)

          data_away = r2.json()

          if data_away.get("errors"):
              print("AWAY TEAM ERRORS:", data_away["errors"])

          away_candidates = data_away.get("response", [])

          if not away_candidates:
              print("AWAY TEAM NOT FOUND")
              sys.exit(1)

          away_team = away_candidates[0]["team"]
          away_id = away_team["id"]

          print("AWAY RESOLVED:", away_team["name"])
          print("AWAY ID:", away_id)

          # ============================================================
          # 3. CARI SEMUA FIXTURE DALAM RENTANG TANGGAL
          # ============================================================

          print("----------------------------------------")
          print("MENCARI FIXTURE BERDASARKAN TANGGAL")

          r3 = requests.get(
              f"{BASE_URL}/fixtures",
              headers=HEADERS,
              params={
                  "from": date_from,
                  "to": date_to
              },
              timeout=30
          )

          print("FIXTURE HTTP:", r3.status_code)

          if r3.status_code != 200:
              print("FIXTURE API ERROR:")
              print(r3.text)
              sys.exit(1)

          data_fixture = r3.json()

          if data_fixture.get("errors"):
              print("FIXTURE API ERRORS:")
              print(data_fixture["errors"])

          fixtures = data_fixture.get("response", [])

          print("TOTAL FIXTURE DITEMUKAN:", len(fixtures))

          # ============================================================
          # 4. COCOKKAN HOME ID + AWAY ID
          # ============================================================

          matched = None

          for item in fixtures:

              teams = item.get("teams", {})

              fixture_home = teams.get("home", {}).get("id")
              fixture_away = teams.get("away", {}).get("id")

              if (
                  fixture_home == home_id
                  and fixture_away == away_id
              ):
                  matched = item
                  break

          # ============================================================
          # 5. JIKA FIXTURE TIDAK DITEMUKAN
          # ============================================================

          if not matched:

              print("----------------------------------------")
              print("EXACT FIXTURE NOT FOUND")

              print("HOME ID:", home_id)
              print("AWAY ID:", away_id)
              print("TOTAL CANDIDATES:", len(fixtures))

              print("----------------------------------------")
              print("CONTOH FIXTURE DARI API:")

              for item in fixtures[:20]:

                  teams = item.get("teams", {})
                  league = item.get("league", {})
                  fixture = item.get("fixture", {})

                  h_name = teams.get("home", {}).get("name")
                  a_name = teams.get("away", {}).get("name")

                  h_id = teams.get("home", {}).get("id")
                  a_id = teams.get("away", {}).get("id")

                  print(
                      h_id,
                      "-",
                      a_id,
                      "|",
                      h_name,
                      "vs",
                      a_name,
                      "|",
                      league.get("name"),
                      "|",
                      fixture.get("date")
                  )

              print("----------------------------------------")
              print("FIXTURE RESOLUTION: FAILED")

              sys.exit(1)

          # ============================================================
          # 6. FIXTURE BERHASIL
          # ============================================================

          fixture = matched.get("fixture", {})
          league = matched.get("league", {})
          teams = matched.get("teams", {})

          fixture_id = fixture.get("id")

          print("----------------------------------------")
          print("FIXTURE RESOLUTION: PASS")
          print("----------------------------------------")

          print("FIXTURE ID:", fixture_id)

          print(
              "MATCH:",
              teams.get("home", {}).get("name"),
              "vs",
              teams.get("away", {}).get("name")
          )

          print("LEAGUE:", league.get("name"))
          print("COUNTRY:", league.get("country"))
          print("DATE:", fixture.get("date"))
          print("STATUS:", fixture.get("status", {}).
