name: Fixture Resolver Evidence Test

on:
  workflow_dispatch:

jobs:
  resolve-evidence:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Resolve and collect evidence
        run: |
          python - <<'PY'
          import os
          import requests

          KEY = os.environ["API_FOOTBALL_KEY"]

          HEADERS = {
              "x-apisports-key": KEY
          }

          # Contoh fixture yang akan dicari.
          # Nanti diganti otomatis dengan fixture dari parser PelangiEuro.
          home = "Seattle Sounders"
          away = "Real Salt Lake"

          print("HOME:", home)
          print("AWAY:", away)

          # 1. Cari tim HOME
          r1 = requests.get(
              "https://v3.football.api-sports.io/teams",
              headers=HEADERS,
              params={"search": home},
              timeout=30
          )

          print("HOME TEAM HTTP:", r1.status_code)

          home_data = r1.json().get("response", [])

          # 2. Cari tim AWAY
          r2 = requests.get(
              "https://v3.football.api-sports.io/teams",
              headers=HEADERS,
              params={"search": away},
              timeout=30
          )

          print("AWAY TEAM HTTP:", r2.status_code)

          away_data = r2.json().get("response", [])

          if not home_data:
              print("HOME TEAM NOT FOUND")
              raise SystemExit(1)

          if not away_data:
              print("AWAY TEAM NOT FOUND")
              raise SystemExit(1)

          home_team = home_data[0]["team"]
          away_team = away_data[0]["team"]

          home_id = home_team["id"]
          away_id = away_team["id"]

          print("--------------------------------")
          print("HOME:", home_team["name"])
          print("HOME ID:", home_id)
          print("AWAY:", away_team["name"])
          print("AWAY ID:", away_id)

          # 3. Cari fixture berdasarkan kedua Team ID
          r3 = requests.get(
              "https://v3.football.api-sports.io/fixtures",
              headers=HEADERS,
              params={
                  "team": home_id,
                  "league": 253,
                  "season": 2026
},
              },
              timeout=30
          )

          print("FIXTURE HTTP:", r3.status_code)

          fixtures = r3.json().get("response", [])

          matched = None

          for item in fixtures:
              teams = item.get("teams", {})
              h = teams.get("home", {}).get("id")
              a = teams.get("away", {}).get("id")

              if h == home_id and a == away_id:
                  matched = item
                  break

          if not matched:
              print("EXACT FIXTURE NOT FOUND")
              print("Fixture candidates:", len(fixtures))
              raise SystemExit(1)

          fixture = matched["fixture"]
          league = matched["league"]

          fixture_id = fixture["id"]

          print("--------------------------------")
          print("FIXTURE ID:", fixture_id)
          print("LEAGUE:", league.get("name"))
          print("DATE:", fixture.get("date"))
          print("STATUS:", fixture.get("status", {}).get("short"))

          # 4. Ambil statistik fixture
          stats = requests.get(
              "https://v3.football.api-sports.io/fixtures/statistics",
              headers=HEADERS,
              params={"fixture": fixture_id},
              timeout=30
          )

          print("STATISTICS HTTP:", stats.status_code)

          # 5. Ambil lineups
          lineups = requests.get(
              "https://v3.football.api-sports.io/fixtures/lineups",
              headers=HEADERS,
              params={"fixture": fixture_id},
              timeout=30
          )

          print("LINEUPS HTTP:", lineups.status_code)

          # 6. Ambil H2H
          h2h = requests.get(
              "https://v3.football.api-sports.io/fixtures/headtohead",
              headers=HEADERS,
              params={
                  "h2h": f"{home_id}-{away_id}"
              },
              timeout=30
          )

          print("H2H HTTP:", h2h.status_code)

          print("--------------------------------")
          print("FIXTURE RESOLUTION: PASS")
          print("EVIDENCE COLLECTION: PASS")
          print("TEAM ID:", home_id, "-", away_id)
          print("FIXTURE ID:", fixture_id)
          print("--------------------------------")
          PY
