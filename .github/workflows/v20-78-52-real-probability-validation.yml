        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q \
            test_v20_78_51_probability.py

      - name: Run final probability tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q \
            test_v20_78_51_final.py

      - name: Run calibration tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q \
            test_v20_78_51_calibration.py

