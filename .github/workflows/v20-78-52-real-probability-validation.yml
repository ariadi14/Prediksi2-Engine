name: V20.78.52 Real Probability Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probability-validation:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy pandas scikit-learn

      # =========================================================
      # 3. VERIFY PROBABILITY MODULES
      # =========================================================
      - name: Verify probability modules
        shell: bash
        run: |
          set -euo pipefail

