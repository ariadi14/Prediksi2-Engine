name: V20.79 Real Market Qualification

on:
  workflow_dispatch:
    inputs:
      minimum_probability:
        description: "Minimum probability threshold"
        required: true
        default: "0.60"
        type: string

jobs:
  market-qualification:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pytest

      # ============================================================
      # 4. PREPARE ARTIFACT DIRECTORY
      # ============================================================
      - name: Prepare artifacts directory
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

      # ============================================================
      # 5. DISCOVER AVAILABLE REAL PROBABILITY DATA
      #
      # We do NOT assume that artifacts from another workflow
      # automatically exist in this workspace.
      # ============================================================
      - name: Discover probability output
        run: |
          set -euo pipefail

          echo "Searching repository for probability output..."

          FOUND=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FOUND="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              \( \
                -name "real_probability_output.json" \
                -o \
                -name "v20_79_real_probability_output.json" \
              \) \
              ! -path "./.git/*" \
              2>/dev/null
          )

          if [ -n "$FOUND" ]; then
            echo "Found probability output:"
            echo "$FOUND"

            cp "$FOUND" \
              artifacts/real_probability_output.json

            echo "PROBABILITY_FOUND=true" >> "$GITHUB_ENV"
          else
            echo "No probability output exists in repository."
            echo "PROBABILITY_FOUND=false" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 6. DISCOVER PROBABILITY INPUT
      # ============================================================
      - name: Discover probability input
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FOUND="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              \( \
                -name "real_probability_input.json" \
                -o \
                -name "v20_79_real_probability_input.json" \
              \) \
              ! -path "./.git/*" \
              2>/dev/null
          )

          if [ -n "$FOUND" ]; then
            echo "Found probability input:"
            echo "$FOUND"

            cp "$FOUND" \
              artifacts/real_probability_input.json

            echo "PROBABILITY_INPUT_FOUND=true" >> "$GITHUB_ENV"
          else
            echo "No probability input exists in repository."
            echo "PROBABILITY_INPUT_FOUND=false" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 7. EXPLICIT DATA AVAILABILITY CHECK
      # ============================================================
      - name: Validate required probability data
        run: |
          set -euo pipefail

          if [ "${PROBABILITY_FOUND:-false}" != "true" ]; then
            echo ""
            echo "=================================================="
            echo "V20.79 MARKET QUALIFICATION"
            echo "=================================================="
            echo ""
            echo "ERROR: Real Probability output is not available"
            echo "inside this workflow workspace."
            echo ""
            echo "The previous Real Probability workflow produced"
            echo "the result as a GitHub Actions artifact."
            echo ""
            echo "GitHub Actions artifacts are NOT automatically"
            echo "available to another workflow."
            echo ""
            echo "No prediction or market will be invented."
            echo ""
            echo "STATUS: WAITING_FOR_REAL_PROBABILITY_DATA"
            echo "=================================================="

            exit 1
          fi

          if [ "${PROBABILITY_INPUT_FOUND:-false}" != "true" ]; then
            echo ""
            echo "ERROR: real_probability_input.json not found."
            echo "STATUS: WAITING_FOR_REAL_PROBABILITY_INPUT"
            exit 1
          fi

          echo "Probability output: available"
          echo "Probability input: available"

      # ============================================================
      # 8. VALIDATE JSON
      # ============================================================
      - name: Validate probability JSON
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("artifacts/real_probability_output.json"),
              Path("artifacts/real_probability_input.json"),
          ]

          for path in files:
              print("Validating:", path)

              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if not isinstance(data, dict):
                  raise RuntimeError(
                      f"{path} must contain a JSON object."
                  )

          print("JSON validation: PASS")
          PY

      # ============================================================
      # 9. REAL MARKET QUALIFICATION
      # ============================================================
      - name: Run market qualification
        env:
          MINIMUM_PROBABILITY: ${{ inputs.minimum_probability }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import os
          import re
          from pathlib import Path

          threshold = float(
              os.environ["MINIMUM_PROBABILITY"]
          )

          if not 0 <= threshold <= 1:
              raise RuntimeError(
                  "minimum_probability must be between 0 and 1."
              )

          probability_data = json.loads(
              Path(
                  "artifacts/real_probability_output.json"
              ).read_text(encoding="utf-8")
          )

          input_data = json.loads(
              Path(
                  "artifacts/real_probability_input.json"
              ).read_text(encoding="utf-8")
          )

          input_by_fixture = {
              str(item.get("fixture_id")): item
              for item in input_data.get("fixtures", [])
          }

          def normalize(value):
              if value is None:
                  return ""

              text = str(value).lower()

              text = (
                  text
                  .replace("–", "-")
                  .replace("—", "-")
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          def get_market_type(text):
              t = normalize(text)

              if "over" in t:
                  return "OVER"

              if "under" in t:
                  return "UNDER"

              if "hdp" in t:
                  return "HDP"

              if "handicap" in t:
                  return "HDP"

              if "home" in t:
                  return "HOME"

              if "away" in t:
                  return "AWAY"

              if "draw" in t:
                  return "DRAW"

              return "UNKNOWN"

          def get_line(text):
              text = normalize(text)

              match = re.search(
                  r"[+-]?\d+(?:\.\d+)?",
                  text
              )

              if match:
                  return match.group(0)

              return None

          def numeric_probability(value):
              if isinstance(value, bool):
                  return None

              if not isinstance(
                  value,
                  (int, float)
              ):
                  return None

              if not math.isfinite(value):
                  return None

              if value < 0 or value > 1:
                  return None

              return float(value)

          def visible_markets(raw):
              output = []

              if not isinstance(raw, list):
                  return output

              for item in raw:

                  if isinstance(item, str):
                      text = item

                      output.append({
                          "raw": text,
                          "market": get_market_type(text),
                          "line": get_line(text),
                      })

                  elif isinstance(item, dict):
                      text = (
                          item.get("raw")
                          or item.get("selection")
                          or item.get("market")
                          or item.get("name")
                          or ""
                      )

                      line = item.get("line")

                      if line is None:
                          line = get_line(text)

                      output.append({
                          "raw": text,
                          "market": get_market_type(text),
                          "line": (
                              str(line)
                              if line is not None
                              else None
                          ),
                      })

              return output

          def extract_market_probability(
              result,
              market_type,
              line
          ):
              market_probabilities = result.get(
                  "market_probabilities"
              )

              if isinstance(
                  market_probabilities,
                  dict
              ):
                  for key, value in market_probabilities.items():

                      probability = numeric_probability(
                          value
                      )

                      if probability is None:
                          continue

                      key_text = normalize(key)

                      if market_type.lower() not in key_text:
                          continue

                      if line:
                          if normalize(line) in key_text:
                              return probability

                      else:
                          return probability

              probabilities = result.get(
                  "probabilities"
              )

              if isinstance(
                  probabilities,
                  dict
              ):

                  aliases = {
                      "HOME": [
                          "home",
                          "home_probability",
                          "1",
                      ],
                      "DRAW": [
                          "draw",
                          "draw_probability",
                          "x",
                      ],
                      "AWAY": [
                          "away",
                          "away_probability",
                          "2",
                      ],
                  }

                  for alias in aliases.get(
                      market_type,
                      []
                  ):

                      for key, value in probabilities.items():

                          if normalize(key) != normalize(alias):
                              continue

                          probability = numeric_probability(
                              value
                          )

                          if probability is not None:
                              return probability

              return None

          qualified = []
          rejected = []

          for result in probability_data.get(
              "results",
              []
          ):

              fixture_id = result.get(
                  "fixture_id"
              )

              source = input_by_fixture.get(
                  str(fixture_id)
              )

              if source is None:
                  rejected.append({
                      "fixture_id": fixture_id,
                      "reason": "NO_INPUT_DATA",
                  })
                  continue

              if result.get("status") != "CALCULATED":
                  rejected.append({
                      "fixture_id": fixture_id,
                      "home_team": result.get(
                          "home_team"
                      ),
                      "away_team": result.get(
                          "away_team"
                      ),
                      "reason": "INSUFFICIENT_DATA",
                  })
                  continue

              markets = visible_markets(
                  source.get(
                      "market_candidates",
                      []
                  )
              )

              if not markets:
                  rejected.append({
                      "fixture_id": fixture_id,
                      "reason": "NO_VISIBLE_MARKET",
                  })
                  continue

              for market in markets:

                  market_type = market["market"]
                  line = market["line"]

                  if market_type == "UNKNOWN":
                      rejected.append({
                          "fixture_id": fixture_id,
                          "selection": market["raw"],
                          "reason": "UNKNOWN_MARKET",
                      })
                      continue

                  probability = extract_market_probability(
                      result,
                      market_type,
                      line
                  )

                  if probability is None:
                      rejected.append({
                          "fixture_id": fixture_id,
                          "selection": market["raw"],
                          "reason": "NO_MARKET_PROBABILITY",
                      })
                      continue

                  if probability < threshold:
                      rejected.append({
                          "fixture_id": fixture_id,
                          "selection": market["raw"],
                          "probability": probability,
                          "reason": "BELOW_THRESHOLD",
                      })
                      continue

                  qualified.append({
                      "fixture_id": fixture_id,
                      "home_team": result.get(
                          "home_team"
                      ),
                      "away_team": result.get(
                          "away_team"
                      ),
                      "competition": source.get(
                          "competition"
                      ),
                      "entity_type": source.get(
                          "entity_type"
                      ),
                      "market": market_type,
                      "line": line,
                      "selection": market["raw"],
                      "probability": probability,

                      "market_visible_in_screenshot": True,

                      "integrity": {
                          "market_from_screenshot": True,
                          "line_from_screenshot": True,
                          "no_market_invention": True,
                      }
                  })

          output = {
              "version": "V20.79",
              "stage": "REAL_MARKET_QUALIFICATION",
              "minimum_probability": threshold,

              "qualified_count": len(
                  qualified
              ),

              "rejected_count": len(
                  rejected
              ),

              "qualified": qualified,
              "rejected": rejected,

              "rules": {
                  "screenshot_market_only": True,
                  "exact_line_only": True,
                  "no_market_invention": True,
                  "no_forced_quota": True,
                  "no_data_not_negative": True,
              },
          }

          Path(
              "artifacts/v20_79_real_market_qualification.json"
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "V20.79 REAL MARKET QUALIFICATION"
          )
          print(
              "=========================================="
          )

          print(
              "Qualified:",
              len(qualified)
          )

          print(
              "Rejected:",
              len(rejected)
          )

          print(
              "Minimum probability:",
              threshold
          )

          print(
              "=========================================="
          )
          PY

      # ============================================================
      # 10. HARD INTEGRITY GATE
      # ============================================================
      - name: Hard market integrity gate
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "artifacts/v20_79_real_market_qualification.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          for item in data.get(
              "qualified",
              []
          ):

              if not item.get(
                  "market_visible_in_screenshot"
              ):
                  raise RuntimeError(
                      "Market visibility violation."
                  )

              integrity = item.get(
                  "integrity",
                  {}
              )

              if not integrity.get(
                  "market_from_screenshot"
              ):
                  raise RuntimeError(
                      "Market source violation."
                  )

              if not integrity.get(
                  "line_from_screenshot"
              ):
                  raise RuntimeError(
                      "Line source violation."
                  )

              if not integrity.get(
                  "no_market_invention"
              ):
                  raise RuntimeError(
                      "Market invention violation."
                  )

          print(
              "Hard market integrity gate: PASS"
          )
          PY

      # ============================================================
      # 11. NO FORCED QUOTA
      # ============================================================
      - name: No forced quota gate
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "artifacts/v20_79_real_market_qualification.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          count = len(
              data.get(
                  "qualified",
                  []
              )
          )

          print(
              "Qualified selections:",
              count
          )

          print(
              "No forced quota: PASS"
          )
          PY

      # ============================================================
      # 12. ENTITY AUDIT
      # ============================================================
      - name: Entity separation audit
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "artifacts/v20_79_real_market_qualification.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          allowed = {
              "CLUB",
              "NATIONAL",
              "WOMEN",
              "U21",
              "U23",
              "YOUTH",
              None,
              "",
          }

          for item in data.get(
              "qualified",
              []
          ):

              entity = item.get(
                  "entity_type"
              )

              if entity not in allowed:
                  raise RuntimeError(
                      f"Unknown entity type: {entity}"
                  )

          print(
              "Entity separation audit: PASS"
          )
          PY

      # ============================================================
      # 13. REPOSITORY TESTS
      # ============================================================
      - name: Run repository tests
        run: |
          set -euo pipefail

          TESTS=""

          for test in \
            test_v20_78_52_data_acquisition.py \
            test_v20_78_52_entity_classifier.py \
            test_v20_78_52_entity_aware_integration.py \
            test_v20_78_52_provider_router.py
          do
            if [ -f "$test" ]; then
              TESTS="$TESTS $test"
            fi
          done

          if [ -n "$TESTS" ]; then
            pytest -q $TESTS
          else
            echo "No legacy V20.78.52 test files found."
            echo "Skipping repository test invocation."
          fi

      # ============================================================
      # 14. SUMMARY
      # ============================================================
      - name: Create summary
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "artifacts/v20_79_real_market_qualification.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          qualified = data.get(
              "qualified",
              []
          )

          rejected = data.get(
              "rejected",
              []
          )

          summary = {
              "version": "V20.79",
              "stage": "REAL_MARKET_QUALIFICATION",

              "qualified_count": len(
                  qualified
              ),

              "rejected_count": len(
                  rejected
              ),

              "screenshot_market_only": True,
              "exact_line_only": True,
              "no_market_invention": True,
              "no_forced_quota": True,
              "no_data_not_negative": True,

              "next_stage": "PARLAY_OPTIMIZER",
          }

          Path(
              "artifacts/v20_79_real_market_qualification_summary.json"
          ).write_text(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # ============================================================
      # 15. UPLOAD RESULTS
      # ============================================================
      - name: Upload qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v20-79-real-market-qualification
          path: artifacts/

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final status
        run: |
          echo ""
          echo "=========================================="
          echo "V20.79 REAL MARKET QUALIFICATION"
          echo "=========================================="
          echo "STATUS: SUCCESS"
          echo "=========================================="
