name: V20.79 - Production Orchestrator Dry Run

on:
  workflow_dispatch:
    inputs:
      time_window:
        description: "Manual time window"
        required: true
        default: "00:00-05:00"
        type: choice
        options:
          - "18:00-21:00"
          - "21:00-00:00"
          - "00:00-05:00"
          - "05:00-10:00"

permissions:
  contents: read

jobs:
  production-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas scikit-learn pillow

      - name: Show selected time window
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "V20.79 PRODUCTION ORCHESTRATOR"
          echo "=========================================="
          echo
          echo "Selected manual time window:"
          echo "${{ inputs.time_window }}"
          echo

      - name: Discover V20.78.52 core
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CORE DISCOVERY"
          echo "=========================================="

          REQUIRED_FILES=(
            "v20_78_52_competition_resolver.py"
            "v20_78_52_data_acquisition.py"
            "v20_78_52_data_quality_bridge.py"
            "v20_78_52_entity_classifier.py"
            "v20_78_52_provider_router.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          echo
          echo "V20.78.52 CORE: READY"

      - name: Python syntax gate
        run: |
          set -euo pipefail

          python -m compileall -q .

          echo "PYTHON SYNTAX: PASS"

      - name: Import V20.78.52 core
        run: |
          set -euo pipefail

          cat > /tmp/import_core.py <<'PY'
          import importlib

          modules = [
              "v20_78_52_competition_resolver",
              "v20_78_52_data_acquisition",
              "v20_78_52_data_quality_bridge",
              "v20_78_52_entity_classifier",
              "v20_78_52_provider_router",
          ]

          for name in modules:
              print(f"IMPORTING: {name}")
              importlib.import_module(name)
              print(f"PASS: {name}")

          print()
          print("V20.78.52 CORE IMPORT: PASS")
          PY

          python /tmp/import_core.py

      - name: Build synthetic screenshot input
        run: |
          set -euo pipefail

          mkdir -p /tmp/v2079

          cat > /tmp/v2079/screenshot_input.json <<'JSON'
          {
            "source": "PelangiEuro",
            "image_id": "V20.79-DRYRUN-001",
            "time_window": "18:00-21:00",
            "fixtures": [
              {
                "fixture_id": "DRY-F001",
                "home_team": "Alpha FC",
                "away_team": "Beta FC",
                "kickoff": "20:00",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "OVER_UNDER",
                    "line": 2.5,
                    "selection": "OVER",
                    "odds": 1.85
                  },
                  {
                    "market": "HDP",
                    "line": -0.75,
                    "selection": "HOME",
                    "odds": 1.90
                  }
                ]
              },
              {
                "fixture_id": "DRY-F002",
                "home_team": "Gamma FC",
                "away_team": "Delta FC",
                "kickoff": "20:30",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "OVER_UNDER",
                    "line": 3.5,
                    "selection": "UNDER",
                    "odds": 1.80
                  }
                ]
              },
              {
                "fixture_id": "DRY-F003",
                "home_team": "Epsilon FC",
                "away_team": "Zeta FC",
                "kickoff": "19:30",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "HOME",
                    "line": null,
                    "selection": "HOME",
                    "odds": 1.70
                  }
                ]
              }
            ]
          }
          JSON

          echo "Synthetic screenshot input created."

      - name: Run orchestrator dry run
        run: |
          set -euo pipefail

          cat > /tmp/v2079/orchestrator.py <<'PY'
