name: V20.78.52 Real Evidence Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-validation:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      # =========================================================
      # 3. VERIFY V20.78.52 MODULES
      # =========================================================
      - name: Verify V20.78.52 modules
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "v20_78_52_data_acquisition.py"
            "v20_78_52_data_quality_bridge.py"
            "v20_78_52_entity_classifier.py"
            "v20_78_52_provider_router.py"
            "v20_78_52_competition_resolver.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING MODULE: $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo ""
          echo "V20.78.52 MODULE CHECK: PASS"

      # =========================================================
      # 4. DATA ACQUISITION TESTS
      # =========================================================
      - name: Run data acquisition tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q test_v20_78_52_data_acquisition.py

      # =========================================================
      # 5. ENTITY TESTS
      # =========================================================
      - name: Run entity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_v20_78_52_entity_classifier.py \
            test_v20_78_52_entity_aware_integration.py

      # =========================================================
      # 6. PROVIDER ROUTING TESTS
      # =========================================================
      - name: Run provider routing tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q test_v20_78_52_provider_router.py

      # =========================================================
      # 7. DATA QUALITY BRIDGE
      # =========================================================
      - name: Validate data quality bridge
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          import v20_78_52_data_quality_bridge as dq

          print("Data quality bridge loaded:", dq.__name__)

          names = [
              name for name in dir(dq)
              if not name.startswith("_")
          ]

          print("Available symbols:")

          for name in names:
              print(" -", name)

          print("DATA QUALITY BRIDGE IMPORT: PASS")
          '

      # =========================================================
      # 8. NO DATA != NEGATIVE DATA
      # =========================================================
      - name: Validate missing-data semantics
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          samples = {
              "lineup": None,
              "injury": None,
              "xg": None,
              "h2h": None,
              "standings": None,
          }

          for field, value in samples.items():
              if value is None:
                  print(field + ": MISSING")

          for field, value in samples.items():
              assert value is None
              assert value != 0

          print("NO DATA != NEGATIVE DATA: PASS")
          '

      # =========================================================
      # 9. EVIDENCE FRESHNESS
      # =========================================================
      - name: Validate evidence freshness rules
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)

          rules = {
              "lineup": 6,
              "injury": 24,
              "h2h": 720,
              "standings": 168,
          }

          for evidence_type, max_age_hours in rules.items():

              timestamp = now

              age = now - timestamp

              fresh = age <= timedelta(
                  hours=max_age_hours
              )

              print(
                  evidence_type,
                  "max_age_hours=",
                  max_age_hours,
                  "fresh=",
                  fresh,
              )

              assert fresh is True

          print("EVIDENCE FRESHNESS RULES: PASS")
          '

      # =========================================================
      # 10. FIXTURE IDENTITY
      # =========================================================
      - name: Validate fixture identity integrity
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          fixtures = [
              {
                  "home": "Liverpool",
                  "away": "Arsenal",
                  "competition": "Premier League",
                  "entity": "CLUB",
              },
              {
                  "home": "Brazil",
                  "away": "Colombia",
                  "competition": "International",
                  "entity": "NATIONAL",
              },
              {
                  "home": "England U21",
                  "away": "Germany U21",
                  "competition": "U21",
                  "entity": "U21",
              },
          ]

          for fixture in fixtures:

              assert fixture["home"]
              assert fixture["away"]
              assert fixture["competition"]
              assert fixture["entity"]

              assert fixture["home"] != fixture["away"]

              print(
                  fixture["home"],
                  "vs",
                  fixture["away"],
                  "|",
                  fixture["competition"],
                  "|",
                  fixture["entity"],
              )

          print("FIXTURE IDENTITY INTEGRITY: PASS")
          '

      # =========================================================
      # 11. API-FOOTBALL PROVIDER
      # =========================================================
      - name: Test API-Football provider
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo "API_FOOTBALL_KEY is missing"
            exit 1
          fi

          echo "Testing API-Football..."

          HTTP_CODE=$(curl -sS \
            -o /tmp/api_football_status.json \
            -w "%{http_code}" \
            -H "x-apisports-key: ${API_FOOTBALL_KEY}" \
            "https://v3.football.api-sports.io/status")

          echo "HTTP status: ${HTTP_CODE}"

          python -c '
          import json

          with open("/tmp/api_football_status.json", "r") as f:
              data = json.load(f)

          print("Response keys:", list(data.keys()))

          if "response" in data:
              print("RESPONSE: PRESENT")

          if data.get("errors"):
              print("ERRORS:", data["errors"])
          '

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "API-Football provider failed"
            cat /tmp/api_football_status.json
            exit 1
          fi

          echo "API-FOOTBALL PROVIDER: PASS"

      # =========================================================
      # 12. FOOTBALL-DATA PROVIDER
      # =========================================================
      - name: Test football-data.org provider
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FOOTBALL_DATA_API_KEY:-}" ]; then
            echo "FOOTBALL_DATA_API_KEY is missing"
            exit 1
          fi

          echo "Testing football-data.org..."

          HTTP_CODE=$(curl -sS \
            -o /tmp/football_data.json \
            -w "%{http_code}" \
            -H "X-Auth-Token: ${FOOTBALL_DATA_API_KEY}" \
            "https://api.football-data.org/v4/competitions")

          echo "HTTP status: ${HTTP_CODE}"

          python -c '
          import json

          with open("/tmp/football_data.json", "r") as f:
              data = json.load(f)

          print("Response keys:", list(data.keys()))

          if "competitions" in data:
              print(
                  "COMPETITIONS:",
                  len(data["competitions"])
              )

          if data.get("message"):
              print("MESSAGE:", data["message"])
          '

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "football-data.org provider failed"
            cat /tmp/football_data.json
            exit 1
          fi

          echo "FOOTBALL-DATA PROVIDER: PASS"

      # =========================================================
      # 13. SPORTMONKS PROVIDER
      # =========================================================
      - name: Test Sportmonks provider
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SPORTMONKS_API_TOKEN:-}" ]; then
            echo "SPORTMONKS_API_TOKEN is missing"
            exit 1
          fi

          echo "Testing Sportmonks..."

          HTTP_CODE=$(curl -sS \
            -o /tmp/sportmonks.json \
            -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: ${SPORTMONKS_API_TOKEN}" \
            "https://api.sportmonks.com/v3/football/leagues")

          echo "HTTP status: ${HTTP_CODE}"

          python -c '
          import json

          with open("/tmp/sportmonks.json", "r") as f:
              data = json.load(f)

          print("Response keys:", list(data.keys()))

          if "data" in data:

              if isinstance(data["data"], list):
                  print(
                      "LEAGUE_COUNT:",
                      len(data["data"])
                  )
              else:
                  print("DATA: PRESENT")

          if "pagination" in data:
              print("PAGINATION: PRESENT")

          if data.get("message"):
              print("MESSAGE:", data["message"])
          '

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Sportmonks provider failed"
            cat /tmp/sportmonks.json
            exit 1
          fi

          echo "SPORTMONKS PROVIDER: PASS"

      # =========================================================
      # 14. PROVIDER POLICY
      # =========================================================
      - name: Validate evidence provider policy
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          from v20_78_52_provider_router import route_provider

          cases = [
              ("Danish Superliga", "sportmonks"),
              ("Scottish Premiership", "sportmonks"),
              ("Premier League", "api-football"),
              ("Brazil Serie A", "api-football"),
          ]

          for competition, expected in cases:

              route = route_provider(
                  competition,
                  api_football_available=True,
                  football_data_available=True,
                  sportmonks_available=True,
              )

              print(
                  competition,
                  "=> primary:",
                  route.primary,
                  "| fallback:",
                  route.fallback,
              )

              assert route.primary == expected

          print("EVIDENCE PROVIDER POLICY: PASS")
          '

      # =========================================================
      # 15. EVIDENCE COMPLETENESS
      # =========================================================
      - name: Validate evidence completeness semantics
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          evidence = {
              "fixture_identity": True,
              "competition": True,
              "recent_form": True,
              "h2h": False,
              "standings": True,
              "lineup": False,
              "injury": False,
              "xg": False,
          }

          available = sum(
              1
              for value in evidence.values()
              if value is True
          )

          missing = sum(
              1
              for value in evidence.values()
              if value is False
          )

          total = len(evidence)

          coverage = available / total

          print("Evidence available:", available)
          print("Evidence missing:", missing)
          print("Evidence total:", total)
          print("Evidence coverage:", round(coverage, 4))

          assert available > 0
          assert missing >= 0
          assert 0 <= coverage <= 1

          assert evidence["lineup"] is False
          assert evidence["injury"] is False
          assert evidence["xg"] is False

          print("EVIDENCE COMPLETENESS SEMANTICS: PASS")
          '

      # =========================================================
      # 16. MARKET INTEGRITY
      # =========================================================
      - name: Run market integrity tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q \
            test_v20_78_51_market_integrity.py

      # =========================================================
      # 17. FINAL SUMMARY
      # =========================================================
      - name: Final validation summary
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "V20.78.52 REAL EVIDENCE VALIDATION"
          echo "=================================================="
          echo "Module integrity          : PASS"
          echo "Data acquisition          : PASS"
          echo "Entity validation         : PASS"
          echo "Provider routing          : PASS"
          echo "Data quality bridge       : PASS"
          echo "Missing-data semantics    : PASS"
          echo "Evidence freshness        : PASS"
          echo "Fixture identity          : PASS"
          echo "API-Football              : PASS"
          echo "football-data.org         : PASS"
          echo "Sportmonks                : PASS"
          echo "Evidence provider policy  : PASS"
          echo "Evidence completeness     : PASS"
          echo "Market integrity          : PASS"
          echo "=================================================="
          echo "REAL EVIDENCE VALIDATION: PASS"
          echo "=================================================="
