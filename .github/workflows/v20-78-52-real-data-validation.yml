name: V20.78.52 Real Data Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-data-validation:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest requests

          echo "====================================="
          echo "VALIDATION ENVIRONMENT: READY"
          echo "====================================="

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          FAILED=0

          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo "FAIL: API_FOOTBALL_KEY"
            FAILED=1
          else
            echo "PASS: API_FOOTBALL_KEY"
          fi

          if [ -z "${FOOTBALL_DATA_API_KEY:-}" ]; then
            echo "FAIL: FOOTBALL_DATA_API_KEY"
            FAILED=1
          else
            echo "PASS: FOOTBALL_DATA_API_KEY"
          fi

          if [ -z "${SPORTMONKS_API_TOKEN:-}" ]; then
            echo "FAIL: SPORTMONKS_API_TOKEN"
            FAILED=1
          else
            echo "PASS: SPORTMONKS_API_TOKEN"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more provider secrets are missing."
            exit 1
          fi

      - name: Validate Entity Classifier
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "ENTITY CLASSIFIER"
          echo "====================================="

          python -m pytest -q \
            test_v20_78_52_entity_classifier.py \
            test_v20_78_52_entity_aware_integration.py

      - name: Validate Competition Resolver
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "COMPETITION RESOLVER"
          echo "====================================="

          if [ -f "test_v20_78_52_provider_router.py" ]; then
            python -m pytest -q test_v20_78_52_provider_router.py
          else
            echo "Competition/provider routing test file not found."
            exit 1
          fi

      - name: Test API-Football
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "API-FOOTBALL REAL CONNECTION"
          echo "====================================="

          HTTP_CODE=$(curl -sS \
            -o /tmp/api_football.json \
            -w "%{http_code}" \
            -H "x-apisports-key: ${API_FOOTBALL_KEY}" \
            "https://v3.football.api-sports.io/status")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API-Football connection failed."
            cat /tmp/api_football.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("/tmp/api_football.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Response received.")

          response = data.get("response", {})

          if response:
              print("API-Football response: PASS")
          else:
              print("WARNING: response object empty.")
          PY

      - name: Test Football-data.org
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "FOOTBALL-DATA.ORG REAL CONNECTION"
          echo "====================================="

          HTTP_CODE=$(curl -sS \
            -o /tmp/football_data.json \
            -w "%{http_code}" \
            -H "X-Auth-Token: ${FOOTBALL_DATA_API_KEY}" \
            "https://api.football-data.org/v4/competitions")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "football-data.org connection failed."
            cat /tmp/football_data.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("/tmp/football_data.json", encoding="utf-8") as f:
              data = json.load(f)

          competitions = data.get("competitions", [])

          print("Competition records:", len(competitions))

          if not isinstance(competitions, list):
              raise SystemExit("Invalid football-data response.")

          print("football-data.org: PASS")
          PY

      - name: Test Sportmonks
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "SPORTMONKS REAL CONNECTION"
          echo "====================================="

          HTTP_CODE=$(curl -sS \
            -o /tmp/sportmonks.json \
            -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: ${SPORTMONKS_API_TOKEN}" \
            "https://api.sportmonks.com/v3/football/leagues")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Sportmonks connection failed."
            cat /tmp/sportmonks.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("/tmp/sportmonks.json", encoding="utf-8") as f:
              data = json.load(f)

          records = data.get("data", [])

          print("League records:", len(records))

          if not isinstance(records, list):
              raise SystemExit("Invalid Sportmonks response.")

          print("Sportmonks: PASS")
          PY

      - name: Validate provider routing rules
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "PROVIDER ROUTING RULES"
          echo "====================================="

          python - <<'PY'
          from v20_78_52_provider_router import route_provider

          cases = [
              ("Danish Superliga", "sportmonks"),
              ("Scottish Premiership", "sportmonks"),
              ("Premier League", "api-football"),
              ("Brazil Serie A", "api-football"),
          ]

          for competition, expected in cases:
              route = route_provider(
                  competition,
                  api_football_available=True,
                  football_data_available=True,
                  sportmonks_available=True,
              )

              print(
                  f"{competition}: "
                  f"primary={route.primary}, "
                  f"fallback={route.fallback}"
              )

              if route.primary != expected:
                  raise SystemExit(
                      f"Routing mismatch for {competition}: "
                      f"expected {expected}, got {route.primary}"
                  )

          print("Provider routing: PASS")
          PY

      - name: Validate data acquisition tests
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "DATA ACQUISITION"
          echo "====================================="

          python -m pytest -q \
            test_v20_78_52_data_acquisition.py

      - name: Validate market integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "MARKET INTEGRITY"
          echo "====================================="

          python -m pytest -q \
            test_v20_78_51_market_integrity.py

      - name: Final validation summary
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "V20.78.52 REAL DATA VALIDATION"
          echo "=============================================="
          echo ""
          echo "Entity classification       : PASS"
          echo "Competition resolution      : PASS"
          echo "API-Football connection     : PASS"
          echo "Football-data connection    : PASS"
          echo "Sportmonks connection       : PASS"
          echo "Provider routing            : PASS"
          echo "Data acquisition            : PASS"
          echo "Market integrity            : PASS"
          echo ""
          echo "REAL DATA VALIDATION: PASS"
          echo "=============================================="
