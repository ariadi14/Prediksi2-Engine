name: V20.79 - Production Orchestrator Dry Run

on:
  workflow_dispatch:
    inputs:
      time_window:
        description: "Manual time window"
        required: true
        default: "00:00-05:00"
        type: choice
        options:
          - "18:00-21:00"
          - "21:00-00:00"
          - "00:00-05:00"
          - "05:00-10:00"

permissions:
  contents: read

jobs:
  production-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas scikit-learn pillow

      - name: Show selected time window
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "V20.79 PRODUCTION ORCHESTRATOR"
          echo "=========================================="
          echo
          echo "Selected manual time window:"
          echo "${{ inputs.time_window }}"
          echo

      - name: Discover V20.78.52 core
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CORE DISCOVERY"
          echo "=========================================="

          REQUIRED_FILES=(
            "v20_78_52_competition_resolver.py"
            "v20_78_52_data_acquisition.py"
            "v20_78_52_data_quality_bridge.py"
            "v20_78_52_entity_classifier.py"
            "v20_78_52_provider_router.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

          echo
          echo "V20.78.52 CORE: READY"

      - name: Python syntax gate
        run: |
          set -euo pipefail

          python -m compileall -q .

          echo "PYTHON SYNTAX: PASS"

      - name: Import V20.78.52 core
        run: |
          set -euo pipefail

          cat > /tmp/import_core.py <<'PY'
          import importlib

          modules = [
              "v20_78_52_competition_resolver",
              "v20_78_52_data_acquisition",
              "v20_78_52_data_quality_bridge",
              "v20_78_52_entity_classifier",
              "v20_78_52_provider_router",
          ]

          for name in modules:
              print(f"IMPORTING: {name}")
              importlib.import_module(name)
              print(f"PASS: {name}")

          print()
          print("V20.78.52 CORE IMPORT: PASS")
          PY

          python /tmp/import_core.py

      - name: Build synthetic screenshot input
        run: |
          set -euo pipefail

          mkdir -p /tmp/v2079

          cat > /tmp/v2079/screenshot_input.json <<'JSON'
          {
            "source": "PelangiEuro",
            "image_id": "V20.79-DRYRUN-001",
            "time_window": "18:00-21:00",
            "fixtures": [
              {
                "fixture_id": "DRY-F001",
                "home_team": "Alpha FC",
                "away_team": "Beta FC",
                "kickoff": "20:00",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "OVER_UNDER",
                    "line": 2.5,
                    "selection": "OVER",
                    "odds": 1.85
                  },
                  {
                    "market": "HDP",
                    "line": -0.75,
                    "selection": "HOME",
                    "odds": 1.90
                  }
                ]
              },
              {
                "fixture_id": "DRY-F002",
                "home_team": "Gamma FC",
                "away_team": "Delta FC",
                "kickoff": "20:30",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "OVER_UNDER",
                    "line": 3.5,
                    "selection": "UNDER",
                    "odds": 1.80
                  }
                ]
              },
              {
                "fixture_id": "DRY-F003",
                "home_team": "Epsilon FC",
                "away_team": "Zeta FC",
                "kickoff": "19:30",
                "competition": "Test League",
                "markets": [
                  {
                    "market": "HOME",
                    "line": null,
                    "selection": "HOME",
                    "odds": 1.70
                  }
                ]
              }
            ]
          }
          JSON

          echo "Synthetic screenshot input created."

      - name: Run orchestrator dry run
        run: |
          set -euo pipefail

          cat > /tmp/v2079/orchestrator.py <<'PY'
          import json
          import math
          from pathlib import Path


          INPUT = Path("/tmp/v2079/screenshot_input.json")
          OUTPUT = Path("/tmp/v2079/orchestrator_output.json")


          def screenshot_parser(payload):
              fixtures = payload.get("fixtures", [])

              assert isinstance(fixtures, list)

              return fixtures


          def time_filter(fixtures, selected_window):
              start, end = selected_window.split("-")

              def minutes(value):
                  hour, minute = map(int, value.split(":"))
                  return hour * 60 + minute

              start_minutes = minutes(start)

              if end == "00:00":
                  end_minutes = 24 * 60
              else:
                  end_minutes = minutes(end)

              output = []

              for fixture in fixtures:
                  kickoff = minutes(fixture["kickoff"])

                  if end_minutes <= 24 * 60:
                      if start_minutes <= kickoff < end_minutes:
                          output.append(fixture)

              return output


          def fixture_resolver(fixtures):
              output = []

              for fixture in fixtures:
                  assert fixture["fixture_id"]
                  assert fixture["home_team"]
                  assert fixture["away_team"]
                  assert fixture["kickoff"]
                  assert fixture["competition"]

                  output.append(fixture)

              return output


          def evidence_stage(fixtures):
              output = []

              for fixture in fixtures:
                  enriched = dict(fixture)

                  enriched["evidence"] = {
                      "recent_form": ["W", "D", "W"],
                      "lineup": None,
                      "injuries": None,
                      "xg": None,
                      "h2h": None
                  }

                  output.append(enriched)

              return output


          def probability_stage(fixtures):
              output = []

              probability_map = {
                  ("DRY-F001", "OVER_UNDER", 2.5, "OVER"): 0.78,
                  ("DRY-F001", "HDP", -0.75, "HOME"): 0.73,
                  ("DRY-F002", "OVER_UNDER", 3.5, "UNDER"): 0.76,
                  ("DRY-F003", "HOME", None, "HOME"): 0.71
              }

              for fixture in fixtures:
                  for market in fixture["markets"]:

                      key = (
                          fixture["fixture_id"],
                          market["market"],
                          market["line"],
                          market["selection"]
                      )

                      probability = probability_map.get(key, 0.50)

                      output.append({
                          "fixture_id": fixture["fixture_id"],
                          "home_team": fixture["home_team"],
                          "away_team": fixture["away_team"],
                          "kickoff": fixture["kickoff"],
                          "competition": fixture["competition"],
                          "market": market["market"],
                          "line": market["line"],
                          "selection": market["selection"],
                          "odds": market["odds"],
                          "probability": probability,
                          "source_market": {
                              "market": market["market"],
                              "line": market["line"],
                              "selection": market["selection"]
                          }
                      })

              return output


          def market_qualification(candidates, screenshot):
              visible = set()

              for fixture in screenshot["fixtures"]:
                  for market in fixture["markets"]:
                      visible.add(
                          (
                              fixture["fixture_id"],
                              market["market"],
                              market["line"],
                              market["selection"]
                          )
                      )

              qualified = []

              for candidate in candidates:

                  key = (
                      candidate["fixture_id"],
                      candidate["market"],
                      candidate["line"],
                      candidate["selection"]
                  )

                  market_visible = key in visible

                  if (
                      market_visible
                      and candidate["probability"] >= 0.70
                  ):
                      item = dict(candidate)
                      item["qualified"] = True
                      qualified.append(item)

              return qualified


          def parlay_optimizer(candidates, requested_quota=7):
              selected = []
              used_fixtures = set()

              candidates = sorted(
                  candidates,
                  key=lambda item: item["probability"],
                  reverse=True
              )

              for candidate in candidates:

                  fixture_id = candidate["fixture_id"]

                  if fixture_id in used_fixtures:
                      continue

                  used_fixtures.add(fixture_id)
                  selected.append(candidate)

                  if len(selected) >= requested_quota:
                      break

              total_odds = math.prod(
                  item["odds"]
                  for item in selected
              )

              joint_probability = math.prod(
                  item["probability"]
                  for item in selected
              )

              return {
                  "selected_candidates": selected,
                  "requested_quota": requested_quota,
                  "filled_quota": len(selected),
                  "total_odds": total_odds,
                  "joint_probability": joint_probability
              }


          def run():

              payload = json.loads(INPUT.read_text())

              selected_window = payload["time_window"]

              parsed = screenshot_parser(payload)

              filtered = time_filter(
                  parsed,
                  selected_window
              )

              fixtures = fixture_resolver(filtered)

              evidence = evidence_stage(fixtures)

              probabilities = probability_stage(evidence)

              qualified = market_qualification(
                  probabilities,
                  payload
              )

              parlay = parlay_optimizer(
                  qualified,
                  requested_quota=7
              )

              result = {
                  "engine_version": "V20.79",
                  "baseline": "V20.78.52",
                  "source": payload["source"],
                  "image_id": payload["image_id"],
                  "time_window": selected_window,
                  "pipeline": [
                      "SCREENSHOT",
                      "PARSER",
                      "TIME_FILTER",
                      "FIXTURE_RESOLVER",
                      "EVIDENCE",
                      "PROBABILITY",
                      "MARKET_QUALIFICATION",
                      "PARLAY_OPTIMIZER"
                  ],
                  "counts": {
                      "parsed": len(parsed),
                      "time_filtered": len(filtered),
                      "resolved": len(fixtures),
                      "probability_candidates": len(probabilities),
                      "qualified": len(qualified),
                      "selected": len(
                          parlay["selected_candidates"]
                      )
                  },
                  "parlay": parlay
              }

              OUTPUT.write_text(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              return result


          if __name__ == "__main__":
              result = run()

              print()
              print("==========================================")
              print("V20.79 ORCHESTRATOR DRY RUN")
              print("==========================================")
              print()

              print(
                  "Pipeline:",
                  " -> ".join(result["pipeline"])
              )

              print()
              print("Counts:")

              for key, value in result["counts"].items():
                  print(f"  {key}: {value}")

              print()
              print("Parlay:")
              print(
                  "  requested:",
                  result["parlay"]["requested_quota"]
              )
              print(
                  "  filled:",
                  result["parlay"]["filled_quota"]
              )
              print(
                  "  total_odds:",
                  result["parlay"]["total_odds"]
              )
              print(
                  "  joint_probability:",
                  result["parlay"]["joint_probability"]
              )
          PY

          python /tmp/v2079/orchestrator.py

      - name: Validate orchestrator output
        run: |
          set -euo pipefail

          cat > /tmp/v2079/validate_output.py <<'PY'
          import json
          from pathlib import Path


          path = Path("/tmp/v2079/orchestrator_output.json")

          result = json.loads(path.read_text())

          assert result["engine_version"] == "V20.79"
          assert result["baseline"] == "V20.78.52"

          expected_pipeline = [
              "SCREENSHOT",
              "PARSER",
              "TIME_FILTER",
              "FIXTURE_RESOLVER",
              "EVIDENCE",
              "PROBABILITY",
              "MARKET_QUALIFICATION",
              "PARLAY_OPTIMIZER"
          ]

          assert result["pipeline"] == expected_pipeline

          counts = result["counts"]

          assert counts["parsed"] == 3
          assert counts["time_filtered"] == 3
          assert counts["resolved"] == 3
          assert counts["probability_candidates"] == 4
          assert counts["qualified"] == 4
          assert counts["selected"] == 3

          parlay = result["parlay"]

          assert parlay["requested_quota"] == 7
          assert parlay["filled_quota"] == 3

          assert parlay["filled_quota"] < parlay["requested_quota"]

          assert parlay["total_odds"] > 1.0
          assert 0.0 < parlay["joint_probability"] <= 1.0

          selected = parlay["selected_candidates"]

          fixture_ids = [
              item["fixture_id"]
              for item in selected
          ]

          assert len(fixture_ids) == len(set(fixture_ids))

          for item in selected:
              assert item["qualified"] is True
              assert item["probability"] >= 0.70
              assert item["source_market"]["market"] == item["market"]
              assert item["source_market"]["line"] == item["line"]
              assert (
                  item["source_market"]["selection"]
                  == item["selection"]
              )

          print("OUTPUT VALIDATION: PASS")
          print()
          print("Selected fixtures:")

          for item in selected:
              print(
                  f"  {item['fixture_id']} | "
                  f"{item['market']} | "
                  f"{item['line']} | "
                  f"{item['selection']} | "
                  f"P={item['probability']} | "
                  f"odds={item['odds']}"
              )
          PY

          python /tmp/v2079/validate_output.py

      - name: Run repository tests
        run: |
          set -euo pipefail

          if find . -type f -name "test_*.py" \
              -not -path "./.git/*" \
              | grep -q .; then

            pytest -q

          else
            echo "No repository pytest files found."
          fi

      - name: Production orchestrator summary
        run: |
          set -euo pipefail

          echo
          echo "======================================================"
          echo " V20.79 PRODUCTION ORCHESTRATOR DRY RUN: PASS"
          echo "======================================================"
          echo
          echo "V20.78.52 remains the production baseline."
          echo
          echo "Pipeline verified:"
          echo
          echo "  Screenshot"
          echo "      ↓"
          echo "  Parser"
          echo "      ↓"
          echo "  Manual Time Filter"
          echo "      ↓"
          echo "  Fixture Resolver"
          echo "      ↓"
          echo "  Evidence"
          echo "      ↓"
          echo "  Probability"
          echo "      ↓"
          echo "  Market Qualification"
          echo "      ↓"
          echo "  Parlay Optimizer"
          echo
          echo "No core V20.78.52 module was modified."
          echo
          echo "NEXT:"
          echo "REAL SCREENSHOT INPUT"
