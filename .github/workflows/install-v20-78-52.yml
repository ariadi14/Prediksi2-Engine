name: Install V20.78.52 From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v20-78-52:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

          python -m pip install --upgrade pip
          python -m pip install pytest

          echo ""
          echo "====================================="
          echo "PYTHON TEST ENVIRONMENT: READY"
          echo "====================================="

          python -m pytest --version

      - name: Find V20.78.52 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Prediksi2_Engine_V20_78_52_GITHUB_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "====================================="
          echo "ZIP FOUND"
          echo "====================================="

          ls -lh "$ZIP"

      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "ZIP CONTENT CHECK"
          echo "====================================="

          unzip -l \
            "Prediksi2_Engine_V20_78_52_GITHUB_READY.zip" \
            | sed -n '1,180p'

          echo ""

          if ! unzip -l \
              "Prediksi2_Engine_V20_78_52_GITHUB_READY.zip" \
              | grep -q "engine/"; then
            echo "ERROR: folder engine/ tidak ditemukan."
            exit 1
          fi

          echo "PASS: engine/ ditemukan."

      - name: Extract engine safely
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/prediksi2_extract
          mkdir -p /tmp/prediksi2_extract

          unzip -q \
            "Prediksi2_Engine_V20_78_52_GITHUB_READY.zip" \
            -d /tmp/prediksi2_extract

          if [ ! -d "/tmp/prediksi2_extract/engine" ]; then
            echo "ERROR: engine directory tidak ditemukan."
            exit 1
          fi

          echo "====================================="
          echo "EXTRACTION: PASS"
          echo "====================================="

      - name: Install source only
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "INSTALL V20.78.52 SOURCE"
          echo "====================================="

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/prediksi2_extract/engine/ \
            ./

          echo ""
          echo "Source V20.78.52 berhasil dipasang."

      - name: Verify critical V20.78.52 files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "MANIFEST_V20_78_52_GITHUB_READY.json"
            "README_V20_78_52_GITHUB_READY.md"
            "v20_78_52_competition_resolver.py"
            "v20_78_52_data_acquisition.py"
            "v20_78_52_data_quality_bridge.py"
            "v20_78_52_entity_classifier.py"
            "v20_78_52_provider_router.py"
            "test_v20_78_52_data_acquisition.py"
            "test_v20_78_52_entity_classifier.py"
            "test_v20_78_52_entity_aware_integration.py"
            "test_v20_78_52_provider_router.py"
          )

          echo "====================================="
          echo "SOURCE VERIFICATION"
          echo "====================================="

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: file tidak ditemukan: $FILE"
              exit 1
            fi

            echo "PASS: $FILE"
          done

          echo ""
          echo "V20.78.52 SOURCE VERIFICATION: PASS"

      - name: Verify workflow protection
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "WORKFLOW PROTECTION CHECK"
          echo "====================================="

          git status --short -- .github/workflows || true

          # Workflow installer tidak boleh memasukkan workflow baru
          # dari dalam ZIP.
          git reset -- .github/workflows || true

          if git diff --name-only -- .github/workflows | grep -q .; then
            echo "ERROR: terdapat perubahan workflow."
            git diff --name-only -- .github/workflows
            exit 1
          fi

          echo "PASS: workflow repository terlindungi."

      - name: Run V20.78.52 tests
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "RUNNING V20.78.52 TESTS"
          echo "====================================="

          python -m pytest -q \
            test_v20_78_52_data_acquisition.py \
            test_v20_78_52_entity_classifier.py \
            test_v20_78_52_entity_aware_integration.py \
            test_v20_78_52_provider_router.py

          echo ""
          echo "====================================="
          echo "V20.78.52 TESTS: PASS"
          echo "====================================="

      - name: Stage source changes only
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          # Jangan pernah memasukkan workflow ke commit installer.
          git reset -- .github/workflows || true

          echo "====================================="
          echo "STAGED FILE CHECK"
          echo "====================================="

          WORKFLOW_FILES="$(git diff --cached --name-only -- .github/workflows || true)"

          if [ -n "$WORKFLOW_FILES" ]; then
            echo "ERROR: workflow masuk staged changes:"
            echo "$WORKFLOW_FILES"
            exit 1
          fi

          echo "PASS: tidak ada workflow yang akan di-commit."

      - name: Commit V20.78.52
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan source untuk di-commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Install Prediksi2 Engine V20.78.52"

          echo ""
          echo "====================================="
          echo "COMMIT CREATED"
          echo "====================================="

          git log -1 --oneline

      - name: Push source to main
        shell: bash
        run: |
          set -euo pipefail

          echo "====================================="
          echo "PUSHING SOURCE TO MAIN"
          echo "====================================="

          git push origin HEAD:main

          echo ""
          echo "====================================="
          echo "V20.78.52 INSTALL: SUCCESS"
          echo "====================================="
