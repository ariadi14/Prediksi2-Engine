name: V20.78.52 Real Fixture Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Verify entity and resolver tests
        run: |
          python -m pytest -q \
            test_v20_78_52_entity_classifier.py \
            test_v20_78_52_entity_aware_integration.py \
            test_v20_78_52_provider_router.py

      - name: Validate fixture categories
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from v20_78_52_entity_classifier import classify_fixture

          cases = [
              ("Liverpool", "Arsenal", "club"),
              ("Brazil", "Colombia", "national"),
              ("Brazil Women", "Colombia Women", "women"),
              ("England U21", "Germany U21", "u21"),
              ("England U23", "France U23", "u23"),
          ]

          for home, away, expected in cases:
              result = classify_fixture(home, away)

              print(
                  f"{home} vs {away} -> "
                  f"{result}"
              )

              text = str(result).lower()

              if expected not in text:
                  raise SystemExit(
                      f"Entity classification mismatch: "
                      f"{home} vs {away}"
                  )

          print("ENTITY CATEGORY VALIDATION: PASS")
          PY

      - name: Validate Sportmonks routing
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from v20_78_52_provider_router import route_provider

          tests = [
              ("Danish Superliga", "sportmonks"),
              ("Scottish Premiership", "sportmonks"),
          ]

          for competition, expected in tests:
              route = route_provider(
                  competition,
                  api_football_available=True,
                  football_data_available=True,
                  sportmonks_available=True,
              )

              print(
                  competition,
                  "=>",
                  route.primary,
                  route.fallback,
              )

              if route.primary != expected:
                  raise SystemExit(
                      f"Wrong provider for {competition}"
                  )

          print("SPORTMONKS SPECIAL ROUTING: PASS")
          PY

      - name: Validate general league routing
        run: |
          python - <<'PY'
          from v20_78_52_provider_router import route_provider

          competitions = [
              "Premier League",
              "La Liga",
              "Serie A",
              "Brazil Serie A",
              "Colombia Primera A",
          ]

          for competition in competitions:
              route = route_provider(
                  competition,
                  api_football_available=True,
                  football_data_available=True,
                  sportmonks_available=True,
              )

              print(
                  competition,
                  "=> primary:",
                  route.primary,
                  "fallback:",
                  route.fallback,
              )

              if route.primary != "api-football":
                  raise SystemExit(
                      f"Unexpected primary provider for {competition}"
                  )

          print("GENERAL LEAGUE ROUTING: PASS")
          PY

      - name: Validate no-data rule
        run: |
          python - <<'PY'
          from v20_78_52_provider_router import route_provider

          route = route_provider(
              "Unknown Competition",
              api_football_available=False,
              football_data_available=False,
              sportmonks_available=False,
          )

          print("Unknown competition route:", route)

          if route.primary != "missing":
              raise SystemExit(
                  "Missing provider state was not preserved."
              )

          print("NO DATA != NEGATIVE DATA: PASS")
          PY

      - name: Run data acquisition tests
        run: |
          python -m pytest -q \
            test_v20_78_52_data_acquisition.py

      - name: Run market integrity tests
        run: |
          python -m pytest -q \
            test_v20_78_51_market_integrity.py

      - name: Final summary
        run: |
          echo "=============================================="
          echo "V20.78.52 REAL FIXTURE VALIDATION"
          echo "=============================================="
          echo "Club entity                    : PASS"
          echo "National entity                : PASS"
          echo "Women entity                   : PASS"
          echo "U21/U23 entity                 : PASS"
          echo "Sportmonks routing             : PASS"
          echo "General provider routing       : PASS"
          echo "Missing-data handling          : PASS"
          echo "Data acquisition               : PASS"
          echo "Market integrity               : PASS"
          echo "=============================================="
          echo "REAL FIXTURE VALIDATION: PASS"
          echo "=============================================="
