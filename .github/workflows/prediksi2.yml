name: Prediksi 2 - V20.78.50 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: V20.78.50 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas Pillow pytesseract rapidfuzz

      - name: Show environment
        run: |
          python --version
          pip --version
          pytest --version
          tesseract --version

      - name: Check V20.78.50 files
        run: |
          echo "=== Repository ==="
          ls -lah

          echo
          echo "=== V20.78.50 ==="
          test -f v20_78_45_historical_validation.py
          test -f v20_78_46_batch_validation.py
          test -f v20_78_47_stress_test.py
          test -f v20_78_48_calibration.py
          test -f v20_78_49_parlay_validation.py
          test -f v20_78_50_production_gate.py
          test -f test_v20_78_45_to_50.py

          echo "Semua file V20.78.50 ditemukan."

      - name: Run V20.78.45 - V20.78.50 validation
        run: |
          pytest -q test_v20_78_45_to_50.py

      - name: Run complete test suite
        run: |
          pytest -q

      - name: Run production gate
        run: |
          python - <<'PY'
          from v20_78_50_production_gate import gate

          result = gate(
              True,
              False,
              True,
              True,
              True,
              True
          )

          print("====================================")
          print("PREDIKSI 2 V20.78.50 PRODUCTION GATE")
          print("====================================")

          print("Version :", result["version"])
          print("Checks  :", result["checks"])
          print("Status  :", result["status"])
          print("Ready   :", result["ready"])

          if result["status"] != "NOT_READY":
              raise SystemExit(
                  "Production gate berada pada status yang tidak diharapkan."
              )
          PY
