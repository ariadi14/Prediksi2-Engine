name: Prediksi 2 - V20.80 Historical Data Layer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v20.80-historical-data-layer

permissions:
  contents: read

jobs:
  historical-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run V20.80 tests
        run: pytest -q test_v20_80_historical_store.py
